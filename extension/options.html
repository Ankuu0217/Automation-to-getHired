<!doctype html>
<html><head><meta charset="utf-8"><title>GetHired extension</title><link rel="stylesheet" href="style.css"></head>
<body class="options">
  <header><span class="mark">∞</span> GetHired extension</header>
  <ol class="steps">
    <li>Open GetHired → <b>Settings → Chrome extension</b> and click <b>Create token</b>.</li>
    <li>Paste the token below and save.</li>
  </ol>
  <label for="appUrl">GetHired address</label>
  <input id="appUrl" type="url" placeholder="https://gethired-ankuu.vercel.app">
  <label for="token">Extension token</label>
  <input id="token" type="password" placeholder="ghx_…" autocomplete="off">
  <button id="save" class="primary">Save &amp; test</button>
  <p id="status" class="status" role="status"></p>
  <script type="module" src="options.js"></script>
</body></html>
