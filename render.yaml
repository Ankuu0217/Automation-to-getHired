# Render Blueprint — the API only. The React app is deployed on Vercel, which
# proxies /api/* to this service (see vercel.json), so the browser only ever
# talks to the Vercel domain and the SameSite=Strict auth cookies stay
# first-party. MongoDB lives on Atlas, files on ImageKit.
# Deploy: Render → New → Blueprint → pick this repo, fill the `sync: false`
# values. Full walkthrough: DEPLOYMENT.md.
services:
  - type: web
    # The service name becomes the URL: https://gethired-api.onrender.com —
    # vercel.json's /api rewrite points there. If Render gives you a different
    # URL (name taken), update vercel.json's destination to match.
    name: gethired-api
    runtime: node
    # FREE profile (0.1 CPU / 512 MB). Sleeps after 15 min idle — keep it awake
    # with a free uptime ping to /health every 5 min (DEPLOYMENT.md §5e); one
    # always-on service ≈ 744 h/month fits Render's 750 free hours.
    # Outgrowing it: plan starter ($7) or standard ($25, ~1000 users) and remove
    # the "free profile" overrides below.
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @jobmail/shared build && pnpm --filter @jobmail/server build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: COOKIE_SECURE
        value: "true"
      # Browser → Vercel → Render: two proxy hops, so the real client IP is 2 back
      # in X-Forwarded-For (needed for the per-IP sign-up/login rate limits).
      - key: TRUST_PROXY
        value: "2"
      # ── free profile overrides (0.1 CPU / 512 MB) ──
      # OCR fallback takes ~1 min per screenshot on 0.1 CPU → off; Gemini reads
      # screenshots, and if it can't the user types the details in.
      - key: OCR_ENABLED
        value: "false"
      # ~0.7 s per login on 0.1 CPU (12 would be ~3 s). Existing hashes still work.
      - key: BCRYPT_COST
        value: "10"
      - key: EXTRACTION_CONCURRENCY
        value: "2"
      - key: UPLOAD_CONCURRENCY
        value: "3"
      - key: QUEUE_SEND_CONCURRENCY
        value: "2"
      # ImageKit free = 3 GB: keep screenshots 14 days
      - key: SCREENSHOT_RETENTION_DAYS
        value: "14"
      # The Vercel URL users open, e.g. https://gethired.vercel.app (no trailing slash).
      # Used for CORS, email-verification links and redirects after Gmail connect.
      - key: CLIENT_URL
        sync: false
      # This service's own URL, e.g. https://gethired-api.onrender.com — used in the
      # open-tracking pixel inside sent emails.
      - key: API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Pin a model ID from AI Studio (aliases can silently change behaviour/price)
      - key: GEMINI_MODEL
        sync: false
      # Optional cheaper model for text-only calls, e.g. a Flash-Lite ID
      - key: GEMINI_TEXT_MODEL
        sync: false
      # ImageKit (resumes + screenshots, private files)
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      # MUST be on the Vercel domain (the OAuth nonce cookie lives there):
      # https://gethired.vercel.app/api/v1/gmail/callback
      - key: GMAIL_REDIRECT_URI
        sync: false
      # Verification emails via Brevo's HTTPS API (free: 300/day). SMTP is BLOCKED
      # on Render free, so don't use SMTP_* / GMAIL_APP_PASSWORD here.
      - key: BREVO_API_KEY
        sync: false
      # A sender verified in Brevo, e.g.  GetHired <yourname@gmail.com>
      - key: MAIL_FROM
        sync: false
